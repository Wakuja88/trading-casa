<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquidaciones</title>
<style>
:root{
  --bg:#eef1f6; --bar:#f6f8fb; --ink:#18223a; --muted:#5d6782; --line:#d6dbe6; --accent:#2747c9;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121826; --bar:#161e2e; --ink:#e7ebf4; --muted:#97a1ba; --line:#2d3850; --accent:#7d97ff; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
nav{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1}
nav button{font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
nav button:focus-visible,.out:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.out{flex:none;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px;white-space:nowrap}
.out:hover{color:var(--ink);border-color:var(--accent)}
.frames{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
</style>
</head>
<body>
<header>
<nav role="tablist" aria-label="Liquidaciones">
  <button role="tab" id="t-total" aria-controls="f-total" data-tab="total">Liquidaciones</button>
  <button role="tab" id="t-mapa" aria-controls="f-mapa" data-tab="mapa">Mapa de liquidaciones</button>
  <button role="tab" id="t-heatmap" aria-controls="f-heatmap" data-tab="heatmap">Heatmap BTC</button>
</nav>
<a class="out" id="out" href="#" target="_blank" rel="noopener" title="Si una página no carga aquí adentro, ábrela en otra pestaña">Abrir aparte ↗</a>
</header>
<div class="frames">
  <iframe id="f-total" title="Liquidaciones" data-src="https://www.coinglass.com/liquidations" hidden></iframe>
  <iframe id="f-mapa" title="Mapa de liquidaciones" data-src="https://www.coinglass.com/pro/futures/LiquidationMap" hidden></iframe>
  <iframe id="f-heatmap" title="Heatmap de liquidaciones BTC" data-src="https://www.coinglass.com/LiquidationHeatMap/BTC" hidden></iframe>
</div>
<script>
(function(){
  const tabs = [...document.querySelectorAll('[data-tab]')];
  const KEY = 'liq-tab';
  function show(name){
    tabs.forEach(t => {
      const on = t.dataset.tab === name;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
      const f = document.getElementById('f-' + t.dataset.tab);
      if (on && !f.src) f.src = f.dataset.src;
      f.hidden = !on;
      if (on) document.getElementById('out').href = f.dataset.src;
    });
    try { localStorage.setItem(KEY, name); } catch(e) {}
  }
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => show(t.dataset.tab));
    t.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
      n.focus(); show(n.dataset.tab);
    });
  });
  let start = null;
  try { start = localStorage.getItem(KEY); } catch(e) {}
  show(tabs.some(t => t.dataset.tab === start) ? start : 'total');
})();
</script>
</body>
</html>
